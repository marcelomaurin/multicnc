; MultiProject: copia local de exemplo para config/postgres.ini perto do executavel.
; Tambem pode apontar MULTIPROJECT_DB_CONFIG para um INI privado.
; Nunca comite postgres.ini com credenciais. Senha por MULTIPROJECT_DB_PASSWORD.
[postgres]
enabled=false
host=127.0.0.1
port=5432
database=projetos
user=projetos_app
schema=multiproject
sslmode=prefer
password_env=MULTIPROJECT_DB_PASSWORD
; Caminho absoluto opcional. Sem valor: procura sql/migrations junto ao executavel
; ou na pasta multiproject/sql/migrations de desenvolvimento.
migrations_dir=
