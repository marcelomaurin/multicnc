name: Linux Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versao de desenvolvimento/release
        default: 0.1.1-dev
        required: true
  push:
    paths: ['installer/linux/**', '**/*.pas', '**/*.lpr', '**/*.lpi', 'tools/**', '.github/workflows/linux-packages.yml']
  pull_request:
    paths: ['installer/linux/**', '**/*.pas', '**/*.lpr', '**/*.lpi', 'tools/**', '.github/workflows/linux-packages.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: multicnc
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || '0.1.1-dev' }}
      MULTICNC_GUI_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: multicnc
      - name: Shared AISerial and simulator units
        uses: actions/checkout@v4
        with:
          repository: marcelomaurin/CHATGPT
          ref: 8599ea762821e767f1130bbbdbf3fe6a5774f275
          path: CHATGPT
          sparse-checkout: |
            pacote/AI Input
            pacote/AI Simulation
            pacote/AI
      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y lazarus lcl-gtk2 fp-units-misc binutils gcc dpkg-dev xvfb xauth
      - name: Gerar pacotes e executar testes nativos
        run: installer/linux/build_release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSuite-Linux-${{ matrix.arch }}
          path: multicnc/dist/linux-${{ matrix.arch }}/*
          if-no-files-found: error
  armhf:
    name: armhf (ARMv7 emulado)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: multicnc
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version || '0.1.1-dev' }}
      MULTICNC_GUI_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: multicnc
      - name: Shared AISerial and simulator units
        uses: actions/checkout@v4
        with:
          repository: marcelomaurin/CHATGPT
          ref: 8599ea762821e767f1130bbbdbf3fe6a5774f275
          path: CHATGPT
          sparse-checkout: |
            pacote/AI Input
            pacote/AI Simulation
            pacote/AI
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Compilar e executar em userspace ARM hard-float
        run: |
          docker run --rm --platform linux/arm/v7 -e VERSION -e MULTICNC_GUI_SMOKE -e MULTICNC_TEST_TIMEOUT=300 \
            -v "$PWD/..:/workspace" -w /workspace/multicnc arm32v7/debian:bookworm sh -ec '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 lazarus lcl-gtk2 fp-units-misc binutils gcc dpkg-dev xvfb xauth
              git config --global --add safe.directory /workspace/multicnc
              installer/linux/build_release.sh armhf
            '
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSuite-Linux-armhf
          path: dist/linux-armhf/*
          if-no-files-found: error
