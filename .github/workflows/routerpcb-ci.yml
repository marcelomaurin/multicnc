name: RouterPCB CI
on:
  workflow_dispatch:
  push:
    paths: ['routerpcb/**', 'laserpcb/src/**', 'src/core/**', 'multisuite/src/core/**', 'src/shared/**', '.github/workflows/routerpcb-ci.yml']
  pull_request:
    paths: ['routerpcb/**', 'laserpcb/src/**', 'src/core/**', 'multisuite/src/core/**', 'src/shared/**', '.github/workflows/routerpcb-ci.yml']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lazarus xvfb
      - name: Core tests (isolacao, furacao, recorte, nivelamento, G-code)
        run: |
          set -e
          lazbuild --ws=nogui routerpcb/tests/test_routerpcb.lpi
          cd routerpcb/tests && ./test_routerpcb
      - name: Build and exercise the UI
        run: |
          set -e
          lazbuild --ws=gtk2 routerpcb/src/app/routerpcb.lpi
          lazbuild --ws=gtk2 routerpcb/tests/test_routerpcb_ui.lpi
          cd routerpcb/tests && xvfb-run -a ./test_routerpcb_ui
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: choco install lazarus --no-progress -y
      - name: Add Lazarus to PATH
        shell: powershell
        run: |
          $laz = Get-ChildItem 'C:\lazarus*' -Directory | Select-Object -First 1
          if (-not $laz) { throw 'Lazarus nao encontrado' }
          $laz.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build RouterPCB
        shell: cmd
        run: |
          lazbuild routerpcb\tests\test_routerpcb.lpi
          if errorlevel 1 exit /b 1
          cd routerpcb\tests
          test_routerpcb.exe
          if errorlevel 1 exit /b 1
          cd ..\..
          lazbuild routerpcb\src\app\routerpcb.lpi
          if errorlevel 1 exit /b 1
          lazbuild routerpcb\tests\test_routerpcb_ui.lpi
          if errorlevel 1 exit /b 1
          cd routerpcb\tests
          test_routerpcb_ui.exe
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: RouterPCB-Windows
          path: routerpcb/src/app/routerpcb.exe
          if-no-files-found: error
