name: MultiCAM Simulator CI
on:
  push:
    paths:
      - 'multicam/**'
      - 'tests/run_all.sh'
      - '.github/workflows/multicam-simulator-ci.yml'
  pull_request:
    paths:
      - 'multicam/**'
      - 'tests/run_all.sh'
      - '.github/workflows/multicam-simulator-ci.yml'
jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
      - name: Compile and run simulator tests
        shell: bash
        run: |
          set -e
          bash tests/run_all.sh multicam
  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lazarus
        run: sudo apt-get update && sudo apt-get install -y lazarus
      - name: Build simulator
        run: lazbuild --build-mode=Default multicam/src/app/multicam_simulator.lpi
