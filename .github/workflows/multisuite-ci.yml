name: MultiSuite CI
on:
  push:
    paths: ['multisuite/**','tests/run_all.sh','.github/workflows/multisuite-ci.yml']
  pull_request:
    paths: ['multisuite/**','tests/run_all.sh','.github/workflows/multisuite-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
      - run: bash tests/run_all.sh multisuite
  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lazarus
      - run: |
          lazbuild multisuite/src/app/multisuite.lpi
          lazbuild multisuite/src/testing/multisuite_test_center.lpi
