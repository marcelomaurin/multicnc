name: MultiAssembly CI
on:
  push:
    paths: ['multiassembly/**','.github/workflows/multiassembly-ci.yml']
  pull_request:
    paths: ['multiassembly/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
      - run: |
          fpc -Fu$GITHUB_WORKSPACE/multiassembly/src/core multiassembly/tests/test_multiassembly.lpr
          ./test_multiassembly
  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lazarus
      - run: lazbuild multiassembly/src/app/multiassembly.lpi
