name: MultiCAD CI
on:
  workflow_dispatch:
  push:
    paths: ['multicad/**', 'src/shared/**', '.github/workflows/multicad-ci.yml']
  pull_request:
    paths: ['multicad/**', 'src/shared/**', '.github/workflows/multicad-ci.yml']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lazarus
      - name: Core tests (planos, unidades, materiais, .mcad, malha)
        run: |
          set -e
          lazbuild --ws=nogui multicad/tests/test_multicad.lpi
          cd multicad/tests && ./test_multicad
      - name: Build the application
        run: lazbuild --ws=gtk2 multicad/src/app/multicad.lpi
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: choco install lazarus --no-progress -y
      - name: Add Lazarus to PATH
        shell: powershell
        run: |
          $laz = Get-ChildItem 'C:\lazarus*' -Directory | Select-Object -First 1
          if (-not $laz) { throw 'Lazarus nao encontrado' }
          $laz.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build MultiCAD
        shell: cmd
        run: |
          lazbuild multicad\tests\test_multicad.lpi
          if errorlevel 1 exit /b 1
          cd multicad\tests
          test_multicad.exe
          if errorlevel 1 exit /b 1
          cd ..\..
          lazbuild multicad\src\app\multicad.lpi
          if errorlevel 1 exit /b 1
