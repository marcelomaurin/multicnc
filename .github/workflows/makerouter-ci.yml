name: MakeRouter CI
on:
  workflow_dispatch:
  push:
    paths: ['makerouter/**', 'laserpcb/src/geom/**', 'makepcb/src/core/**', 'src/core/**', 'multisuite/src/core/**', 'src/shared/**', '.github/workflows/makerouter-ci.yml']
  pull_request:
    paths: ['makerouter/**', 'laserpcb/src/geom/**', 'makepcb/src/core/**', 'src/core/**', 'multisuite/src/core/**', 'src/shared/**', '.github/workflows/makerouter-ci.yml']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lazarus xvfb
      - name: Core tests (percursos, zero virtual, G-code, simulacao)
        run: |
          set -e
          lazbuild --ws=nogui makerouter/tests/test_makerouter.lpi
          cd makerouter/tests && ./test_makerouter
      - name: Build and exercise the UI
        run: |
          set -e
          lazbuild --ws=gtk2 makerouter/src/app/makerouter.lpi
          lazbuild --ws=gtk2 makerouter/tests/test_makerouter_ui.lpi
          cd makerouter/tests && xvfb-run -a ./test_makerouter_ui
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: choco install lazarus --no-progress -y
      - name: Add Lazarus to PATH
        shell: powershell
        run: |
          $laz = Get-ChildItem 'C:\lazarus*' -Directory | Select-Object -First 1
          if (-not $laz) { throw 'Lazarus nao encontrado' }
          $laz.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build MakeRouter
        shell: cmd
        run: |
          lazbuild makerouter\tests\test_makerouter.lpi
          if errorlevel 1 exit /b 1
          cd makerouter\tests
          test_makerouter.exe
          if errorlevel 1 exit /b 1
          cd ..\..
          lazbuild makerouter\src\app\makerouter.lpi
          if errorlevel 1 exit /b 1
          lazbuild makerouter\tests\test_makerouter_ui.lpi
          if errorlevel 1 exit /b 1
          cd makerouter\tests
          test_makerouter_ui.exe
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: MakeRouter-Windows
          path: makerouter/src/app/makerouter.exe
          if-no-files-found: error
