name: Windows Installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versao de desenvolvimento/release
        default: 0.06
        required: true
  push:
    paths:
      - 'installer/windows/**'
      - '**/*.pas'
      - '**/*.lpr'
      - '**/*.lpi'
      - 'tools/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths: ['installer/windows/**', '**/*.pas', '**/*.lpr', '**/*.lpi', 'tools/**', '.github/workflows/windows-installer.yml']
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || '0.06' }}
    defaults:
      run:
        working-directory: multicnc
    steps:
      - uses: actions/checkout@v4
        with:
          path: multicnc
      - name: Dependency AISerial used by MultiCNC
        uses: actions/checkout@v4
        with:
          repository: marcelomaurin/CHATGPT
          ref: 8599ea762821e767f1130bbbdbf3fe6a5774f275
          path: CHATGPT
          sparse-checkout: |
            pacote/AI Input
            pacote/AI Simulation
            pacote/AI
      - name: Install Lazarus
        run: choco install lazarus --no-progress -y
      - name: Add Lazarus to PATH
        shell: powershell
        run: |
          $laz = Get-ChildItem 'C:\lazarus*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $laz) { throw 'Lazarus nao encontrado' }
          $laz.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fpc = Get-ChildItem $laz.FullName -Filter fpc.exe -File -Recurse | Select-Object -First 1
          if (-not $fpc) { throw 'Free Pascal nao encontrado' }
          $fpc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Add Inno Setup to PATH
        shell: powershell
        run: |
          'C:\Program Files (x86)\Inno Setup 6' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build suite and installer
        shell: cmd
        run: installer\windows\build_release.bat
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MultiSuite-Windows-Installer
          path: |
            multicnc/dist/setup_*.exe
            multicnc/dist/SHA256SUMS
            multicnc/dist/app/build-manifest.json
            multicnc/dist/app/qa-tests.json
          if-no-files-found: error
