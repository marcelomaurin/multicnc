name: MultiCAD Rig and Motion
on:
  push:
    paths: ['multicad/**', '.github/workflows/multicad-rig-ci.yml']
  pull_request:
    paths: ['multicad/**', '.github/workflows/multicad-rig-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lazarus fp-units-net fp-units-misc libcurl4-openssl-dev xvfb xauth
      - name: Rig, Pascal, skinning, persistence and AI response tests
        run: |
          lazbuild --ws=nogui multicad/tests/test_rig_motion.lpi
          multicad/tests/test_rig_motion
      - name: Compile MultiCAD and exercise the editor
        run: |
          lazbuild --ws=gtk2 multicad/src/app/multicad.lpi
          lazbuild --ws=gtk2 multicad/tests/test_rig_ui.lpi
          MULTICAD_KERNEL=pascal xvfb-run -a multicad/tests/test_rig_ui
      - uses: actions/upload-artifact@v4
        with:
          name: multicad-linux-rig
          path: |
            multicad/src/app/multicad
            multicad/examples/robo-articulado.*
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: choco install lazarus --no-progress -y
      - name: Add Lazarus to PATH
        shell: powershell
        run: |
          $laz = Get-ChildItem 'C:\lazarus*' -Directory | Select-Object -First 1
          if (-not $laz) { throw 'Lazarus nao encontrado' }
          $laz.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and compile rig editor
        shell: cmd
        run: |
          lazbuild multicad\tests\test_rig_motion.lpi
          if errorlevel 1 exit /b 1
          multicad\tests\test_rig_motion.exe
          if errorlevel 1 exit /b 1
          lazbuild multicad\src\app\multicad.lpi
          if errorlevel 1 exit /b 1
          lazbuild multicad\tests\test_rig_ui.lpi
          if errorlevel 1 exit /b 1
          set MULTICAD_KERNEL=pascal
          multicad\tests\test_rig_ui.exe
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: multicad-windows-rig
          path: |
            multicad/src/app/multicad.exe
            multicad/examples/robo-articulado.*
